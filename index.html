<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Rock Log</title>

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rock Log">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#14130f;
    --surface:#201e19;
    --surface-2:#2a2721;
    --text:#efe7d8;
    --text-muted:#a69c87;
    --border:rgba(239,231,216,0.12);

    --rust:#b5542c;
    --moss:#6b7a55;
    --slate:#4c6572;
    --amethyst:#8a7599;
    --ochre:#c99a3d;

    --font-display:'Fraunces', serif;
    --font-body:'Newsreader', serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); }
  body{
    font-family:var(--font-body);
    color:var(--text);
    overflow:hidden;
  }

  #map{ position:absolute; inset:0; background:var(--bg); }

  /* Leaflet dark-theme touch-ups */
  .leaflet-control-zoom a{
    background:var(--surface) !important;
    color:var(--text) !important;
    border-color:var(--border) !important;
  }
  .leaflet-control-zoom a:hover{ background:var(--surface-2) !important; }
  .leaflet-control-attribution{
    background:rgba(20,19,15,0.75) !important;
    color:var(--text-muted) !important;
  }
  .leaflet-control-attribution a{ color:var(--text-muted) !important; }

  /* Darken and warm real satellite imagery to match the palette */
  .sat-tiles{
    filter: brightness(0.55) contrast(1.15) saturate(0.7) sepia(0.12) hue-rotate(-8deg);
  }

  .basemap-toggle{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:8px 12px;
    cursor:pointer;
    user-select:none;
  }
  .basemap-toggle:hover{ border-color:var(--rust); color:var(--rust); }
  .legend-map-toggle{ display:none; }

  /* ============ HEADER / SPECIMEN TAG ============ */
  .site-header{
    position:absolute;
    top:20px; left:20px;
    z-index:500;
    max-width:300px;
    background:var(--surface);
    border:1px solid var(--border);
    padding:18px 20px;
    opacity:0;
    animation:rise 0.7s ease forwards;
  }
  .site-header .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rust);
    display:block;
    margin-bottom:8px;
  }
  .site-header h1{
    font-family:var(--font-display);
    font-optical-sizing:auto;
    font-weight:600;
    font-size:26px;
    line-height:1.15;
    margin:0 0 6px 0;
  }
  .site-header p{
    font-size:13.5px;
    color:var(--text-muted);
    margin:0;
    line-height:1.5;
  }
  .site-header .rule{
    width:32px; height:2px; background:var(--rust);
    margin:12px 0 12px 0; border:none;
  }
  .total-stat{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin:16px 0 0 0;
  }
  .total-number{
    font-family:var(--font-display);
    font-optical-sizing:auto;
    font-weight:700;
    font-size:38px;
    line-height:1;
    color:var(--text);
  }
  .total-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-muted);
  }
  .site-header .count{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }
  .site-header .count b{ color:var(--text); font-weight:500; }

  .random-btn{
    display:block;
    width:100%;
    margin-top:14px;
    padding:9px 0;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .random-btn:hover:not(:disabled){ border-color:var(--rust); color:var(--rust); }
  .random-btn:disabled{ opacity:0.4; cursor:default; }

  .header-actions{ display:flex; flex-direction:column; }
  .header-actions .short-label{ display:none; }

  .unknown-btn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:9px 10px;
    background:transparent;
    border:1px solid var(--ochre);
    color:var(--ochre);
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    line-height:1.4;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .unknown-btn:hover{ background:var(--ochre); color:var(--bg); }

  .unknown-card{
    display:flex;
    gap:12px;
    padding:14px 0;
    border-top:1px solid var(--border);
  }
  .unknown-thumb{
    width:64px; height:64px;
    object-fit:cover;
    flex:none;
    background:var(--surface-2);
  }
  .unknown-thumb-empty{
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:4px;
  }
  .unknown-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .unknown-meta{ font-size:13px; color:var(--text); margin-bottom:8px; }

  /* ============ STRATIGRAPHIC LEGEND (signature element) ============ */
  .legend{
    position:absolute;
    left:20px; bottom:24px;
    z-index:500;
    display:flex;
    align-items:flex-end;
    gap:14px;
    opacity:0;
    animation:rise 0.7s ease 0.15s forwards;
  }
  .legend-core{
    display:flex;
    flex-direction:column-reverse;
    width:14px;
    border:1px solid var(--border);
    overflow:hidden;
    background:var(--surface);
  }
  .legend-layer{ width:100%; min-height:6px; }
  .legend-keys{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
  }
  .legend-key{ display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .legend-swatch{ width:9px; height:9px; flex:none; transform:rotate(45deg); }
  .legend-title{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:6px;
    display:block;
  }

  .precision-key{ margin-top:12px; }
  .prec-icon{
    width:9px; height:9px;
    flex:none;
    position:relative;
    transform:rotate(45deg);
    background:var(--text-muted);
    border:2px solid var(--bg);
  }
  .prec-icon::after{
    content:"";
    position:absolute;
    inset:-5px;
    border-style:solid;
    border-width:3px;
    border-color:var(--text-muted);
    opacity:0.9;
  }
  .prec-icon.prec-approximate::after{
    border-width:1.5px;
    opacity:0.75;
  }
  .prec-icon.prec-area::after{
    border-style:dashed;
    border-width:1.5px;
    opacity:0.6;
  }

  /* ============ MARKERS ============ */
  /* Ring colour = category colour (or gold if favourited).
     Ring style = location precision: thick solid (exact) / thin solid (approximate) / dashed (area). */
  .gem-marker{
    position:relative;
    width:14px; height:14px;
    transform:rotate(45deg);
    background:var(--marker-fill, currentColor);
    border:2px solid var(--bg);
    box-shadow:0 2px 6px rgba(0,0,0,0.5);
    transition:transform 0.15s ease;
  }
  .gem-marker::after{
    content:"";
    position:absolute;
    inset:-6px;
    border-style:solid;
    border-width:3px;
    border-color:var(--ring-color, currentColor);
    opacity:0.9;
  }
  .gem-marker.precision-approximate::after{
    border-width:1.5px;
    opacity:0.75;
  }
  .gem-marker.precision-area::after{
    border-style:dashed;
    border-width:1.5px;
    opacity:0.6;
  }
  .leaflet-marker-icon:hover .gem-marker,
  .gem-wrap:hover .gem-marker{ transform:rotate(45deg) scale(1.35); }
  .gem-wrap.active .gem-marker{
    box-shadow:0 0 0 3px var(--rust), 0 0 16px rgba(181,84,44,0.85), 0 2px 6px rgba(0,0,0,0.5);
    transform:rotate(45deg) scale(1.5);
  }

  /* Name labels — only shown once zoomed in enough to avoid clutter */
  .leaflet-tooltip.rock-label{
    background:transparent;
    border:none;
    box-shadow:none;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.02em;
    padding:0 0 0 6px;
    text-shadow:0 1px 4px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.7);
  }
  .leaflet-tooltip.rock-label::before{ display:none; }
  #map:not(.show-labels) .leaflet-tooltip-pane{ opacity:0; pointer-events:none; }
  #map.show-labels .leaflet-tooltip-pane{ opacity:1; transition:opacity 0.2s ease; }

  .cluster-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface-2);
    border:2px solid var(--text-muted);
    border-radius:50%;
    color:var(--text);
    font-family:var(--font-mono);
    font-weight:500;
    box-shadow:0 0 0 1px rgba(239,231,216,0.25), 0 2px 8px rgba(0,0,0,0.5);
    transition:transform 0.15s ease;
  }
  .cluster-wrap:hover .cluster-badge{ transform:scale(1.08); }

  /* ============ DETAIL PANEL ============ */
  #detail-panel{
    position:absolute;
    top:0; right:0;
    height:100%;
    width:380px;
    max-width:92vw;
    background:var(--surface);
    border-left:1px solid var(--border);
    z-index:600;
    transform:translateX(100%);
    transition:transform 0.35s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
  }
  #detail-panel.open{ transform:translateX(0); }

  #detail-panel .close-btn{
    position:absolute;
    top:14px; right:14px;
    width:30px; height:30px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  #detail-panel .close-btn:hover{ background:var(--rust); border-color:var(--rust); }

  .panel-photo{
    width:100%; height:240px;
    object-fit:cover;
    display:block;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
  }
  .panel-photo-fallback{
    width:100%; height:240px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
    color:var(--text-muted);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .panel-body{ padding:22px 24px 28px; }
  .panel-eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:10px;
    display:inline-block;
  }
  .panel-body h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    line-height:1.15;
    margin:0 0 16px 0;
  }
  .panel-row{
    display:flex;
    gap:12px;
    padding:11px 0;
    border-top:1px solid var(--border);
    font-size:14px;
  }
  .panel-row .k{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    width:84px;
    flex:none;
    padding-top:2px;
  }
  .panel-row .v{ color:var(--text); line-height:1.45; }
  .panel-notes{
    font-family:var(--font-body);
    font-style:italic;
    color:var(--text-muted);
    font-size:14.5px;
    line-height:1.6;
    margin:16px 0 0 0;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .ig-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:20px;
    padding:11px 18px;
    background:transparent;
    border:1px solid var(--rust);
    color:var(--rust);
    text-decoration:none;
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .ig-link:hover{ background:var(--rust); color:var(--bg); }

  .unmapped-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 4px;
    border:none;
    border-top:1px solid var(--border);
    background:transparent;
    cursor:pointer;
    text-align:left;
    font-family:var(--font-body);
    color:var(--text);
  }
  .unmapped-row:hover{ background:var(--surface-2); }
  .unmapped-row .dot{
    width:9px; height:9px; flex:none;
    transform:rotate(45deg);
  }
  .unmapped-row .label{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .unmapped-row .name{ font-size:14.5px; }
  .unmapped-row .sub{ font-size:12px; color:var(--text-muted); font-family:var(--font-mono); }
  .unmapped-row .arrow{ color:var(--text-muted); flex:none; }

  /* ============ LOADING / EMPTY STATES ============ */
  #status-banner{
    position:absolute;
    bottom:24px; right:24px;
    z-index:500;
    background:var(--surface);
    border:1px solid var(--border);
    padding:10px 16px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    display:none;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .site-header, .legend{ animation:none; opacity:1; }
    #detail-panel{ transition:none; }
  }

  /* ============ MOBILE ============ */
  @media (max-width: 640px){
    .site-header{
      max-width:calc(100vw - 32px);
      padding:12px 14px;
    }
    .site-header h1{ font-size:18px; }
    .site-header p{ display:none; }
    .total-stat{ margin-top:8px; }
    .total-number{ font-size:26px; }
    .site-header .rule{ margin:8px 0; }
    .site-header .count{ font-size:9.5px; }

    .legend{ display:none !important; }

    .header-actions{
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:650;
      flex-direction:row;
      gap:8px;
      padding:10px 12px;
      padding-bottom:max(10px, env(safe-area-inset-bottom));
      background:var(--surface);
      border-top:1px solid var(--border);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .header-actions button{
      flex:none;
      width:auto;
      white-space:nowrap;
      margin-top:0;
      padding:11px 16px;
      font-size:11px;
    }
    .header-actions .full-label{ display:none; }
    .header-actions .short-label{ display:inline; }

    #browse-all-btn{ order:1; }
    #favorites-btn{ order:2; }
    #unknown-rock-btn{ order:3; }
    #random-rock-btn{ order:4; }

    .leaflet-control-zoom{ display:none !important; }
    .legend-map-toggle{ display:block; }
    .leaflet-bottom.leaflet-right{ margin-bottom:60px; }

    #detail-panel{
      width:100%; max-width:100%;
      top:auto; bottom:0; right:0;
      height:78vh;
      border-left:none;
      border-top:1px solid var(--border);
      transform:translateY(100%);
      z-index:700;
    }
    #detail-panel.open{ transform:translateY(0); }
    body:has(#detail-panel.open) .header-actions{ display:none; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="site-header">
  <h1 id="page-title">The Rock Log</h1>
  <p id="page-subtitle">Specimens, and where they were found.</p>
  <div class="total-stat">
    <span class="total-number" id="total-number">0</span>
    <span class="total-label">specimens</span>
  </div>
  <hr class="rule" />
  <span class="count" id="specimen-count">Loading specimens&hellip;</span>
  <div class="header-actions" id="header-actions">
    <button id="random-rock-btn" class="random-btn" disabled><span class="full-label">Take me to a rock &rarr;</span><span class="short-label">Random &rarr;</span></button>
    <button id="browse-all-btn" class="random-btn" disabled><span class="full-label">Browse all specimens &rarr;</span><span class="short-label">All &rarr;</span></button>
    <button id="favorites-btn" class="unknown-btn" style="display:none;"><span class="full-label">&#9733; My favourites</span><span class="short-label">&#9733; Favs</span></button>
    <button id="unknown-rock-btn" class="unknown-btn" style="display:none;"><span class="full-label">Unknown rocks &mdash; help me identify them</span><span class="short-label">Unknown ID</span></button>
  </div>
</div>

<div class="legend" id="legend" style="display:none;">
  <div>
    <div class="legend-core" id="legend-core"></div>
  </div>
  <div class="legend-keys" id="legend-keys"></div>
  <div class="precision-key" id="precision-key" style="display:none;">
    <span class="legend-title">Location</span>
    <div class="legend-key"><span class="prec-icon prec-exact"></span>Exact</div>
    <div class="legend-key"><span class="prec-icon prec-approximate"></span>Approximate</div>
    <div class="legend-key"><span class="prec-icon prec-area"></span>Area</div>
  </div>
</div>

<div id="detail-panel">
  <button class="close-btn" id="close-panel" aria-label="Close">&times;</button>
  <div id="panel-content"></div>
</div>

<div id="status-banner"></div>

<script>
/* =====================================================================
   CONFIG — this is the only part you should need to touch.
   Paste the published-CSV link from your Google Sheet here.
   See the SETUP guide for exactly how to get this link.
   ===================================================================== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQXBO_QVZkrMqgf79bWXoMo0W69XBfZ-oHiRF4jOW6O95OEHfjSN5VLRbPK5zmHzq8Xn4vEeyV90cV/pub?gid=0&single=true&output=csv";

const PAGE_TITLE = "Lauren's Rock Collection";
const PAGE_SUBTITLE = "Specimens, and where they were found.";

/* Sample data shown until a real sheet is connected above. */
const SAMPLE_DATA = [
  { name:"Banded Amethyst Geode", category:"Purchased", locality:"Artigas, Uruguay", lat:-30.4, lng:-56.5,
    source:"Mineral show, Tucson AZ", photo:"https://images.unsplash.com/photo-1518544801976-3e159e50e5bb?w=800&q=80",
    instagram:"https://instagram.com", notes:"First piece of the collection — bought on a whim, never regretted it." },
  { name:"Rose Quartz", category:"Found", locality:"Custer, South Dakota, USA", lat:43.75, lng:-103.6,
    source:"Field trip, undergrad", photo:"https://images.unsplash.com/photo-1610375461369-d613b564f4e8?w=800&q=80",
    instagram:"https://instagram.com", notes:"" },
  { name:"Malachite Nodule", category:"Gifted", locality:"Katanga, DR Congo", lat:-10.7, lng:25.5,
    source:"Gift from a colleague", photo:"https://images.unsplash.com/photo-1610375229029-539f2b3c8e2b?w=800&q=80",
    instagram:"https://instagram.com", notes:"" },
  { name:"Pyrite Cube Cluster", category:"Purchased", locality:"Navajún, Spain", lat:42.2, lng:-2.15,
    source:"Online specimen dealer", photo:"https://images.unsplash.com/photo-1607301405390-d831c242f59b?w=800&q=80",
    instagram:"https://instagram.com", notes:"" },
  { name:"Obsidian Flake", category:"Found", locality:"Newberry Volcano, Oregon, USA", lat:43.7, lng:-121.3,
    source:"", photo:"", instagram:"https://instagram.com", notes:"" },
  { name:"Labradorite Slab", category:"Traded", locality:"Nain, Labrador, Canada", lat:56.5, lng:-61.7,
    source:"Traded at a gem show", photo:"https://images.unsplash.com/photo-1600267175161-cfaa711b4a81?w=800&q=80",
    instagram:"https://instagram.com", notes:"" }
];

/* =====================================================================
   Category colour cycle — assigned automatically to whatever values
   appear in the Category column, in first-seen order.
   ===================================================================== */
const PALETTE = ["#b5542c", "#6b7a55", "#4c6572", "#8a7599", "#c99a3d"];
const categoryColor = {};
function colorFor(cat){
  if(!cat) cat = "Uncategorised";
  if(!categoryColor[cat]){
    const used = Object.keys(categoryColor).length;
    categoryColor[cat] = PALETTE[used % PALETTE.length];
  }
  return categoryColor[cat];
}

document.getElementById("page-title").textContent = PAGE_TITLE;
document.getElementById("page-subtitle").textContent = PAGE_SUBTITLE;
document.title = PAGE_TITLE;

const map = L.map("map", { zoomControl:false, worldCopyJump:true }).setView([20, 10], 2.3);
L.control.zoom({ position:"bottomright" }).addTo(map);

const darkLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

const satLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: '&copy; Esri, Maxar, Earthstar Geographics',
  maxZoom: 19,
  className: "sat-tiles"
});

let onSatellite = false;
const basemapBtn = L.control({ position: "bottomright" });
basemapBtn.onAdd = function(){

  div.innerHTML = "Satellite";
  div.title = "Switch basemap";
  L.DomEvent.disableClickPropagation(div);
  div.addEventListener("click", () => {
    onSatellite = !onSatellite;

      satLayer.addTo(map);
      div.innerHTML = "Map";
    } else {
      map.removeLayer(satLayer);

};

const markersLayer = L.markerClusterGroup({
  maxClusterRadius: 50,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  iconCreateFunction: function(cluster){
    const count = cluster.getChildCount();
    const children = cluster.getAllChildMarkers();
    const cats = new Set(children.map(m => m.rockCategory || "Uncategorised"));
    const ringColor = cats.size === 1 ? colorFor([...cats][0]) : "var(--text-muted)";
    let size = 34;
    if(count >= 10) size = 42;
    if(count >= 50) size = 50;
    return L.divIcon({
      html: `<div class="cluster-badge" style="width:${size}px; height:${size}px; font-size:${size > 42 ? 14 : 12}px; border-color:${ringColor};">${count}</div>`,
      className: "cluster-wrap",
      iconSize: L.point(size, size)
    });
  }
}).addTo(map);

/* ============ MARKER + PANEL ============ */
function makeIcon(color, isFavorite, precision){
  let classes = "gem-marker";
  if(precision === "approximate") classes += " precision-approximate";
  if(precision === "area") classes += " precision-area";
  const ringColor = isFavorite ? "var(--ochre)" : color;
  const style = `--marker-fill:${color}; --ring-color:${ringColor};`;
  return L.divIcon({
    className: "gem-wrap",
    html: `<div class="${classes}" style="${style}"></div>`,
    iconSize: [14,14],
    iconAnchor: [7,7]
  });
}

let activeMarkerEl = null;
function setActiveMarker(marker){
  clearActiveMarker();
  if(marker && marker.getElement && marker.getElement()){
    activeMarkerEl = marker.getElement();
    activeMarkerEl.classList.add("active");
  }
}
function clearActiveMarker(){
  if(activeMarkerEl){
    activeMarkerEl.classList.remove("active");
    activeMarkerEl = null;
  }
}

function openPanel(rock){
  const panel = document.getElementById("detail-panel");
  const content = document.getElementById("panel-content");
  const color = colorFor(rock.category);
  setActiveMarker(rock._marker);

  const photoHtml = rock.photo
    ? `<img class="panel-photo" src="${rock.photo}" alt="${escapeHtml(rock.name)}" />`
    : `<div class="panel-photo-fallback">No photo yet</div>`;

  const igHtml = rock.instagram
    ? `<a class="ig-link" href="${rock.instagram}" target="_blank" rel="noopener">View original post &rarr;</a>`
    : "";

  const notesHtml = rock.notes
    ? `<p class="panel-notes">${escapeHtml(rock.notes)}</p>`
    : "";

  content.innerHTML = `
    ${photoHtml}
    <div class="panel-body">
      <span class="panel-eyebrow" style="color:${color}">${escapeHtml(rock.category || "Specimen")}${rock.favorite ? ' &nbsp;&#9733;' : ''}</span>
      <h2>${escapeHtml(rock.name)}</h2>
      <div class="panel-row"><div class="k">Found in</div><div class="v">${escapeHtml(rock.locality || "Unknown")}</div></div>
      ${(!isNaN(rock.lat) && !isNaN(rock.lng)) ? `<div class="panel-row"><div class="k">Coordinates</div><div class="v" style="font-family:var(--font-mono); font-size:12.5px;">${rock.lat.toFixed(4)}, ${rock.lng.toFixed(4)}</div></div>` : ""}
      ${rock.precision !== "exact" ? `<div class="panel-row"><div class="k">Location</div><div class="v" style="text-transform:capitalize;">${escapeHtml(rock.precision)}</div></div>` : ""}
      ${rock.classification ? `<div class="panel-row"><div class="k">Classification</div><div class="v">${escapeHtml(rock.classification)}</div></div>` : ""}
      ${rock.formation ? `<div class="panel-row"><div class="k">Formation</div><div class="v">${escapeHtml(rock.formation)}</div></div>` : ""}
      ${rock.dimensions ? `<div class="panel-row"><div class="k">Dimensions</div><div class="v">${escapeHtml(rock.dimensions)}</div></div>` : ""}
      ${rock.weight ? `<div class="panel-row"><div class="k">Weight</div><div class="v">${escapeHtml(rock.weight)}</div></div>` : ""}
      ${rock.source ? `<div class="panel-row"><div class="k">Sourced</div><div class="v">${escapeHtml(rock.source)}</div></div>` : ""}
      ${rock.displayLocation ? `<div class="panel-row"><div class="k">On display</div><div class="v">${escapeHtml(rock.displayLocation)}</div></div>` : ""}
      ${rock.condition ? `<div class="panel-row"><div class="k">Condition</div><div class="v">${escapeHtml(rock.condition)}</div></div>` : ""}
      ${notesHtml}
      ${igHtml}
    </div>
  `;
  panel.classList.add("open");
}
document.getElementById("close-panel").addEventListener("click", () => {
  document.getElementById("detail-panel").classList.remove("open");
  clearActiveMarker();
});

function goToRock(rock){
  if(!isNaN(rock.lat) && !isNaN(rock.lng)){
    map.flyTo([rock.lat, rock.lng], 7, { duration: 1.3 });
    map.once("moveend", () => openPanel(rock));
  } else {
    openPanel(rock);
  }
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

/* ============ LEGEND (stratigraphic column, built from real counts) ============ */
function buildLegend(rocks){
  const counts = {};
  rocks.forEach(r => {
    const cat = r.category || "Uncategorised";
    counts[cat] = (counts[cat] || 0) + 1;
  });
  const cats = Object.keys(counts);
  if(cats.length === 0) return;

  const core = document.getElementById("legend-core");
  const keys = document.getElementById("legend-keys");
  core.innerHTML = ""; keys.innerHTML = "";

  cats.forEach(cat => {
    const color = colorFor(cat);
    const layer = document.createElement("div");
    layer.className = "legend-layer";
    layer.style.background = color;
    layer.style.flexGrow = counts[cat];
    core.appendChild(layer);

    const key = document.createElement("div");
    key.className = "legend-key";
    key.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>${escapeHtml(cat)} (${counts[cat]})`;
    keys.appendChild(key);
  });
  document.getElementById("legend").style.display = "flex";

  const hasVariedPrecision = rocks.some(r => r.precision && r.precision !== "exact");
  document.getElementById("precision-key").style.display = hasVariedPrecision ? "block" : "none";
}

/* ============ DATA LOADING ============ */
function parseBool(val){
  if(!val) return false;
  const v = String(val).trim().toLowerCase();
  return v === "yes" || v === "y" || v === "true" || v === "1" || v === "\u2605";
}

function parsePrecision(val){
  if(!val) return "exact";
  const v = String(val).trim().toLowerCase();
  if(v.startsWith("approx")) return "approximate";
  if(v.startsWith("area") || v.includes("city") || v.includes("country") || v.includes("state")) return "area";
  if(v.startsWith("unk")) return "unknown";
  return "exact";
}

function normaliseRow(row){
  return {
    name: row.Name || row.name || "Unnamed specimen",
    category: (row.Category || row.category || "").trim(),
    locality: row.Locality || row.locality || row["Location Found"] || "",
    lat: parseFloat(row.Lat || row.lat || row.Latitude),
    lng: parseFloat(row.Lng || row.lng || row.Longitude),
    precision: parsePrecision(row.Precision || row.precision || row["Location Precision"]),
    source: row.Source || row.source || row["Sourced From"] || "",
    photo: row.Photo || row.photo || row["Photo URL"] || "",
    instagram: row.Instagram || row.instagram || row["Instagram URL"] || "",
    notes: row.Notes || row.notes || "",
    favorite: parseBool(row.Favourite || row.Favorite || row.favourite || row.favorite),
    classification: row.Classification || row.classification || "",
    formation: row.Formation || row.formation || "",
    dimensions: row.Dimensions || row.dimensions || "",
    weight: row.Weight || row.weight || "",
    displayLocation: row["Display Location"] || row.Display || row.display || row.displayLocation || "",
    condition: row.Condition || row.condition || ""
  };
}

async function loadData(){
  let rows;
  if(SHEET_CSV_URL && SHEET_CSV_URL.trim() !== ""){
    try{
      const res = await fetch(SHEET_CSV_URL);
      const csvText = await res.text();
      const parsed = Papa.parse(csvText, { header:true, skipEmptyLines:true });
      rows = parsed.data.map(normaliseRow).filter(r => r.name);
    }catch(e){
      showStatus("Could not load the sheet — showing sample data instead.");
      rows = SAMPLE_DATA.map(normaliseRow);
    }
  } else {
    rows = SAMPLE_DATA.map(normaliseRow);
  }
  await renderRocks(rows);
}

async function renderRocks(rocks){
  markersLayer.clearLayers();
  const bounds = [];

  for(const rock of rocks){
    if(isNaN(rock.lat) || isNaN(rock.lng)) continue;

    const marker = L.marker([rock.lat, rock.lng], { icon: makeIcon(colorFor(rock.category), rock.favorite, rock.precision) });
    marker.bindTooltip(rock.name, { permanent:true, direction:"right", className:"rock-label", offset:[6,0] });
    marker.on("click", () => openPanel(rock));
    marker.addTo(markersLayer);
    rock._marker = marker;
    marker.rockCategory = rock.category || "Uncategorised";
    bounds.push([rock.lat, rock.lng]);
  }

  hideStatus();
  buildLegend(rocks.filter(r => !isNaN(r.lat) && !isNaN(r.lng)));

  document.getElementById("total-number").textContent = rocks.length;
  currentAll = rocks.slice().sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById("browse-all-btn").disabled = currentAll.length === 0;
  currentUnmapped = rocks.filter(r => isNaN(r.lat) || isNaN(r.lng));
  currentMapped = rocks.filter(r => !isNaN(r.lat) && !isNaN(r.lng));
  currentUnknown = rocks.filter(r => r.classification && r.classification.trim().toLowerCase() === "unknown");
  document.getElementById("unknown-rock-btn").style.display = currentUnknown.length ? "block" : "none";
  currentFavorites = rocks.filter(r => r.favorite);
  document.getElementById("favorites-btn").style.display = currentFavorites.length ? "block" : "none";
  const placed = currentMapped.length;
  document.getElementById("random-rock-btn").disabled = currentMapped.length === 0;
  let countHtml = `<b>${placed}</b> specimen${placed===1?"":"s"} mapped`;
  if(currentUnmapped.length > 0){
    countHtml += `<br><span id="unmapped-count" style="color:var(--text-muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px;">${currentUnmapped.length} without a location &rarr;</span>`;
  } else {
    countHtml += `<br><span id="unmapped-count" style="display:none;"></span>`;
  }
  document.getElementById("specimen-count").innerHTML = countHtml;
  document.getElementById("unmapped-count").addEventListener("click", () => {
    if(currentUnmapped.length) openUnmappedPanel();
  });

  if(bounds.length){
    map.fitBounds(bounds, { padding:[60,60], maxZoom:6 });
  }
  updateLabelVisibility();
}

loadData();
